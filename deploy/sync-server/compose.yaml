# Runs the EtchaSketch sync server. From this folder: docker compose up -d --build
# The app then uses http://<this machine's address>:5080 as its sync server.
services:
  etchasketch-sync:
    build:
      context: ../..
      dockerfile: src/EtchaSketch.Server/Dockerfile
    image: etchasketch-sync
    restart: unless-stopped
    ports:
      - "5080:8080"
    volumes:
      - etchasketch-sync:/data
    # Limits on how much the server may take are in the Sync section of its settings; set any of
    # them here, for example Sync__MaxStreams: "20". The defaults suit a household.
    environment:
      # Set SYNC_JOIN_TOKEN in a file named .env next to this one (see .env.example).
      Sync__JoinToken: "${SYNC_JOIN_TOKEN:-}"
    mem_limit: 256m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  etchasketch-sync:
